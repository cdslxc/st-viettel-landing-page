<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Y-Fest Fullscreen Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2e060a;
        }

        .fullscreen-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(180deg, #a71d2a 0%, #76101a 50%, #2e060a 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        .header-logos {
            flex-shrink: 0;
            padding: clamp(16px, 4vh, 36px) clamp(20px, 5vw, 60px) clamp(10px, 2vh, 18px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- Image Area --- */
        .main-content {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        /*
         * Centering trick: absolute position + transform.
         * max-width / max-height use calc() so the browser gets
         * concrete pixel values → works on every mobile browser.
         */
        .mosaic-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: block;
            width: auto;
            height: auto;
            max-width:  calc(100% - clamp(32px, 8vw, 96px));   /* padding left+right */
            max-height: calc(100% - clamp(16px, 4vh, 48px));   /* padding top+bottom  */

            border-radius: clamp(12px, 4vw, 24px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* --- Footer --- */
        .footer-action {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(16px, 3vh, 28px) 20px clamp(24px, 5vh, 48px);
        }

        .download-btn {
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 14px clamp(24px, 5vw, 40px);
            border-radius: 40px;
            font-size: clamp(14px, 2vw, 16px);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .download-btn:hover,
        .download-btn:active {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .mosaic-image {
                border-radius: 24px;
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-container">

        <header class="header-logos">
            <img src="validated_svg.svg" alt="Header Logos" class="header-svg">
        </header>

        <main class="main-content">
            <img id="dynamic-mosaic" class="mosaic-image" src="g14ZDAfw.jpeg" alt="Mosaic Portrait" crossorigin="anonymous">
        </main>

        <footer class="footer-action">
            <button class="download-btn" id="download-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                Download / Lưu ảnh
            </button>
        </footer>

    </div>

    <script>
        /**
         * JS fallback: after the image loads, explicitly set max-height
         * in pixels so that browsers that can't resolve calc(100% - ...)
         * still display correctly.
         */
        function fitImage() {
            const main = document.querySelector('.main-content');
            const img  = document.getElementById('dynamic-mosaic');
            if (!main || !img) return;

            const availH = main.clientHeight - 20; // 10px padding top+bottom
            const availW = main.clientWidth  - 40; // 20px padding left+right

            // Only constrain; never stretch beyond natural size
            img.style.maxHeight = availH + 'px';
            img.style.maxWidth  = availW + 'px';
        }

        const img = document.getElementById('dynamic-mosaic');
        if (img) {
            if (img.complete) fitImage();
            else img.addEventListener('load', fitImage);
        }
        window.addEventListener('resize', fitImage);

        /**
         * Download the current image (mobile-friendly)
         */
        async function downloadImage() {
            const btn = document.getElementById('download-btn');
            const imgEl = document.getElementById('dynamic-mosaic');
            
            if (!imgEl || !imgEl.src) return;

            try {
                // Instantly generate a blob from the displayed image using Canvas.
                // This bypasses network delays, ensuring Safari doesn't block navigator.share 
                // due to "user interaction timeout" (which happens if fetch() takes too long).
                const canvas = document.createElement('canvas');
                canvas.width = imgEl.naturalWidth || imgEl.width;
                canvas.height = imgEl.naturalHeight || imgEl.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgEl, 0, 0);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 1.0));
                if (!blob) throw new Error("Canvas toBlob failed");

                const file = new File([blob], 'yfest-mosaic.jpg', { type: 'image/jpeg' });

                // Try Web Share API (native share sheet with "Save Image" option)
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Y-Fest Mosaic'
                        });
                        return; // Share was successful
                    } catch (err) {
                        console.log('User cancelled share or share failed:', err);
                        // Continue to fallback
                    }
                }

                // Fallback 1: Create an object URL and trigger a download via <a> tag
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'yfest-mosaic.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 2000);

            } catch (e) {
                console.error('Fetch/Share failed:', e);
                // Ultimate Fallback: navigate directly to the image or download URL
                if (btn && btn.dataset.downloadUrl) {
                    window.location.href = btn.dataset.downloadUrl;
                } else {
                    window.location.href = imgEl.src;
                }
            }
        }

        // Attach download handler
        const btn = document.getElementById('download-btn');
        if (btn) {
            btn.addEventListener('click', downloadImage);
        }

        /**
         * Parse URL hash → load Dropbox image
         */
        function updateImageFromHash() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            const params = new URLSearchParams(hash);
            const id     = params.get('id');
            const rlkey  = params.get('rlkey');
            const st     = params.get('st');

            if (id && rlkey) {
                const isScl = id.includes('/');
                
                // Use dl.dropboxusercontent.com directly for the img src to bypass redirect/CORS blocking on mobile
                const rawBaseUrl = isScl ? `https://dl.dropboxusercontent.com/scl/fi/${id}` : `https://dl.dropboxusercontent.com/s/${id}`;
                // Use www.dropbox.com for the fallback download link
                const dlBaseUrl  = isScl ? `https://www.dropbox.com/scl/fi/${id}` : `https://www.dropbox.com/s/${id}`;
                
                let rawUrl      = `${rawBaseUrl}?rlkey=${rlkey}`;
                let downloadUrl = `${dlBaseUrl}?rlkey=${rlkey}&dl=1`;

                if (st) {
                    rawUrl += `&st=${st}`;
                    downloadUrl += `&st=${st}`;
                }

                const imgEl = document.getElementById('dynamic-mosaic');
                if (imgEl) {
                    imgEl.onload = fitImage;
                    imgEl.src    = rawUrl;
                }

                // Store download URL on button for downloadImage() to use
                const btn = document.getElementById('download-btn');
                if (btn) btn.dataset.downloadUrl = downloadUrl;
            }
        }

        window.addEventListener('DOMContentLoaded', updateImageFromHash);
        window.addEventListener('hashchange', updateImageFromHash);
    </script>
</body>
</html>
